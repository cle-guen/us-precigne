allowBuilds:
  unrs-resolver: true
  esbuild: true
  sharp: true

overrides:
  source-map-js: 1.2.2
  brace-expansion@^1.1.0: 1.1.21
  brace-expansion@^5.0.0: 5.0.12
  zod@^4.0.0: 4.6.7

# These upstream plugins still declare ESLint <=9; the configured rules are tested with ESLint 10.
peerDependencyRules:
  allowedVersions:
    eslint-plugin-import>eslint: '10'
    eslint-plugin-jsx-a11y>eslint: '10'
    eslint-plugin-react>eslint: '10'
